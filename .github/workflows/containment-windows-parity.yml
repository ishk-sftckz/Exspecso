name: Containment Windows parity
on:
  push:
    branches: [codex/containment-windows-parity-20260828]
permissions: {}
concurrency:
  group: containment-windows-parity
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Fetch this exact public task snapshot
        shell: pwsh
        run: |
          git init .
          if ($LASTEXITCODE) { throw 'git init failed' }
          git remote add origin https://github.com/ishk-sftckz/exspecso.git
          git fetch --depth=1 origin $env:GITHUB_SHA
          if ($LASTEXITCODE) { throw 'git fetch failed' }
          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE) { throw 'git checkout failed' }
      - name: Inspect the pinned native Windows SDK and toolchain
        shell: pwsh
        run: ./native/windows-preflight.ps1
      - name: Fetch checksum-verified native Node inputs
        shell: pwsh
        run: |
          @'
          import { createHash } from 'node:crypto';
          import { writeFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { join, basename } from 'node:path';
          if (process.arch !== 'x64') throw new Error('Native x64 Node bootstrap required');
          const base = 'https://nodejs.org/dist/v20.19.0/';
          const sumsResponse = await fetch(base + 'SHASUMS256.txt');
          if (!sumsResponse.ok) throw new Error('Cannot fetch checksums');
          const sums = await sumsResponse.text();
          for (const name of ['node-v20.19.0-win-x64.zip', 'node-v20.19.0-headers.tar.gz', 'win-x64/node.lib']) {
            const response = await fetch(base + name);
            if (!response.ok) throw new Error('Cannot fetch ' + name);
            const bytes = Buffer.from(await response.arrayBuffer());
            const sha256 = createHash('sha256').update(bytes).digest('hex');
            const expected = sums.split('\n').map(line => line.trim().split(/\s+/)).find(parts => parts[1] === name)?.[0];
            if (sha256 !== expected) throw new Error('Checksum mismatch: ' + name);
            writeFileSync(join(process.env.RUNNER_TEMP, basename(name)), bytes);
            console.log(JSON.stringify({name, sha256}));
          }
          execFileSync('tar', ['-xf', join(process.env.RUNNER_TEMP, 'node-v20.19.0-win-x64.zip'), '-C', process.env.RUNNER_TEMP]);
          appendFileSync(process.env.GITHUB_PATH, join(process.env.RUNNER_TEMP, 'node-v20.19.0-win-x64') + '\n');
          appendFileSync(process.env.GITHUB_ENV, 'EXSPECSO_NODE_HEADERS=' + join(process.env.RUNNER_TEMP, 'node-v20.19.0-headers.tar.gz') + '\n');
          appendFileSync(process.env.GITHUB_ENV, 'EXSPECSO_NODE_LIB=' + join(process.env.RUNNER_TEMP, 'node.lib') + '\n');
          '@ | node --input-type=module
          if ($LASTEXITCODE) { throw 'Node input verification failed' }
      - name: Install locked development dependencies without lifecycle scripts
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE) { throw 'npm ci failed' }
      - name: Observe RED provider tests before Windows implementation
        run: |
          npm test -- --run tests/unit/contained-fs.test.ts --testTimeout 30000 --reporter=default --reporter=json --outputFile=windows-red-results.json
          if ($LASTEXITCODE -eq 0) { throw 'Expected RED before the Windows provider exists' }
      - name: Preserve actual Windows observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: containment-windows-parity
          path: |
            windows-preflight/
            windows-red-results.json
          if-no-files-found: error
          retention-days: 7
