name: Containment Windows parity
on:
  push:
    branches: [codex/containment-windows-parity-20260828]
permissions: {}
concurrency:
  group: containment-windows-parity
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Fetch this exact public task snapshot
        shell: pwsh
        run: |
          git init .
          if ($LASTEXITCODE) { throw 'git init failed' }
          git remote add origin https://github.com/ishk-sftckz/exspecso.git
          git fetch --depth=1 origin $env:GITHUB_SHA
          if ($LASTEXITCODE) { throw 'git fetch failed' }
          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE) { throw 'git checkout failed' }
      - name: Inspect the pinned native Windows SDK and toolchain
        shell: pwsh
        run: ./native/windows-preflight.ps1
      - name: Fetch checksum-verified native Node inputs
        shell: pwsh
        run: |
          @'
          import { createHash } from 'node:crypto';
          import { writeFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { join, basename } from 'node:path';
          if (process.arch !== 'x64') throw new Error('Native x64 Node bootstrap required');
          const base = 'https://nodejs.org/dist/v20.19.0/';
          const sumsResponse = await fetch(base + 'SHASUMS256.txt');
          if (!sumsResponse.ok) throw new Error('Cannot fetch checksums');
          const sums = await sumsResponse.text();
          for (const name of ['node-v20.19.0-win-x64.zip', 'node-v20.19.0-headers.tar.gz', 'win-x64/node.lib']) {
            const response = await fetch(base + name);
            if (!response.ok) throw new Error('Cannot fetch ' + name);
            const bytes = Buffer.from(await response.arrayBuffer());
            const sha256 = createHash('sha256').update(bytes).digest('hex');
            const expected = sums.split('\n').map(line => line.trim().split(/\s+/)).find(parts => parts[1] === name)?.[0];
            if (sha256 !== expected) throw new Error('Checksum mismatch: ' + name);
            writeFileSync(join(process.env.RUNNER_TEMP, basename(name)), bytes);
            console.log(JSON.stringify({name, sha256}));
          }
          execFileSync('tar', ['-xf', join(process.env.RUNNER_TEMP, 'node-v20.19.0-win-x64.zip'), '-C', process.env.RUNNER_TEMP]);
          appendFileSync(process.env.GITHUB_PATH, join(process.env.RUNNER_TEMP, 'node-v20.19.0-win-x64') + '\n');
          appendFileSync(process.env.GITHUB_ENV, 'EXSPECSO_NODE_HEADERS=' + join(process.env.RUNNER_TEMP, 'node-v20.19.0-headers.tar.gz') + '\n');
          appendFileSync(process.env.GITHUB_ENV, 'EXSPECSO_NODE_LIB=' + join(process.env.RUNNER_TEMP, 'node.lib') + '\n');
          '@ | node --input-type=module
          if ($LASTEXITCODE) { throw 'Node input verification failed' }
      - name: Install locked development dependencies without lifecycle scripts
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE) { throw 'npm ci failed' }
      - name: Build the native Windows release provider and TypeScript
        run: |
          node native/build.mjs --variant release --target win32-x64 --out . --headers "$env:EXSPECSO_NODE_HEADERS" --node-lib "$env:EXSPECSO_NODE_LIB"
          if ($LASTEXITCODE) { throw 'Native build failed' }
          npm run build
          if ($LASTEXITCODE) { throw 'TypeScript build failed' }
      - name: Prove native Windows provider parity
        run: npm test -- --run tests/unit/contained-fs.test.ts --testTimeout 30000 --reporter=default --reporter=json --outputFile=windows-provider-results.json
      - name: Record the historical installed CLI race RED
        env:
          EXSPECSO_RUN_VULNERABLE_TRACER: '1'
        run: |
          npm test -- --run tests/integration/init-codex-tracer.test.ts -t 'native (leaf|parent|ancestor) substitution' --reporter=default --reporter=json --outputFile=historical-red-results.json
          if ($LASTEXITCODE -ne 1) { throw 'Expected historical regression exit 1' }
          node -e "const r=require('./historical-red-results.json');const a=r.testResults.flatMap(t=>t.assertionResults).filter(t=>t.status==='failed');if(a.length!==3||a.some(t=>!t.failureMessages.join('').includes('external sentinel')))process.exit(1)"
          if ($LASTEXITCODE) { throw 'Historical failures did not reproduce the external-write regression' }
          exit 0
      - name: Exercise the actual installed Windows CLI
        run: npm test -- --run tests/integration/init-codex-tracer.test.ts --testTimeout 60000 --reporter=default --reporter=json --outputFile=windows-tracer-results.json
      - name: Preserve actual Windows observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: containment-windows-parity
          path: |
            windows-preflight/
            windows-provider-results.json
            historical-red-results.json
            windows-tracer-results.json
            dist/native/
          if-no-files-found: error
          retention-days: 7
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Fetch this exact public task snapshot
        shell: bash
        run: |
          git init .
          git remote add origin https://github.com/ishk-sftckz/exspecso.git
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Verify the approved runner and fetch checksum-verified Node inputs
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { writeFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { join } from 'node:path';
          if (process.arch !== 'arm64' || process.env.ImageVersion !== '20260727.0256.1') throw new Error('Runner CPU/image drift: ' + JSON.stringify({arch: process.arch, image: process.env.ImageVersion}));
          const base = 'https://nodejs.org/dist/v20.19.0/';
          const sumsResponse = await fetch(base + 'SHASUMS256.txt');
          if (!sumsResponse.ok) throw new Error('Cannot fetch Node checksums');
          const sums = await sumsResponse.text();
          for (const name of ['node-v20.19.0-darwin-arm64.tar.gz', 'node-v20.19.0-headers.tar.gz']) {
            const response = await fetch(base + name);
            if (!response.ok) throw new Error('Cannot fetch ' + name);
            const bytes = Buffer.from(await response.arrayBuffer());
            const sha256 = createHash('sha256').update(bytes).digest('hex');
            const expected = sums.split('\n').map(line => line.trim().split(/\s+/)).find(parts => parts[1] === name)?.[0];
            if (sha256 !== expected) throw new Error('Node input hash mismatch: ' + name);
            writeFileSync(join(process.env.RUNNER_TEMP, name), bytes);
            console.log(JSON.stringify({name, sha256}));
          }
          execFileSync('tar', ['-xzf', join(process.env.RUNNER_TEMP, 'node-v20.19.0-darwin-arm64.tar.gz'), '-C', process.env.RUNNER_TEMP]);
          appendFileSync(process.env.GITHUB_PATH, join(process.env.RUNNER_TEMP, 'node-v20.19.0-darwin-arm64', 'bin') + '\n');
          appendFileSync(process.env.GITHUB_ENV, 'EXSPECSO_NODE_HEADERS=' + join(process.env.RUNNER_TEMP, 'node-v20.19.0-headers.tar.gz') + '\n');
          console.log(JSON.stringify({image: process.env.ImageVersion, arch: process.arch}));
          NODE
      - name: Install locked development dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Build the release provider and TypeScript
        run: |
          node native/build.mjs --variant release --target darwin-arm64 --out . --headers "$EXSPECSO_NODE_HEADERS"
          npm run build
      - name: Run the provider and installed tracer tests
        run: npm test -- --run tests/unit/contained-fs.test.ts tests/integration/init-codex-tracer.test.ts --testTimeout 60000 --reporter=default --reporter=json --outputFile=tracer-results.json
      - name: Record the historical installed CLI race RED
        env:
          EXSPECSO_RUN_VULNERABLE_TRACER: '1'
        run: |
          status=0
          npm test -- --run tests/integration/init-codex-tracer.test.ts -t 'native (leaf|parent|ancestor) substitution' --reporter=default --reporter=json --outputFile=historical-red-results.json || status=$?
          test "$status" = 1
          node -e "const r=require('./historical-red-results.json');const a=r.testResults.flatMap(t=>t.assertionResults).filter(t=>t.status==='failed');if(a.length!==3||a.some(t=>!t.failureMessages.join('').includes('external sentinel')))process.exit(1)"
      - name: Run the existing regression suite with the host provider
        run: npm test -- --run --testTimeout 60000 --reporter=default --reporter=json --outputFile=regression-results.json
      - name: Preserve the actual host binaries and test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: containment-posix-tracer
          path: |
            dist/native/
            tracer-results.json
            regression-results.json
            historical-red-results.json
          if-no-files-found: warn
          retention-days: 7
