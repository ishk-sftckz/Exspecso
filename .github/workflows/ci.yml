name: Representative package compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.13.0
          - os: ubuntu-latest
            node: 24.x
          - os: macos-latest
            node: 24.x
          - os: windows-latest
            node: 24.x
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - run: npm test -- --run
      - run: npm pack --dry-run --json
